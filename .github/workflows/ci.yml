name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --disable-pip-version-check ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m unittest -v
      - name: Compile
        run: python -m compileall -q camp_leverage.py
      - name: Build distributions
        run: python -m build
      - name: Smoke-test console commands
        run: leverage --version

  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Build isolated integration image
        run: docker build -f tests/integration/Dockerfile -t camp-leverage-integration .
      - name: Verify cross-Camp repository deduplication
        run: docker run --rm --network none camp-leverage-integration
      - name: Verify terminal rendering in a PTY
        run: >-
          docker run --rm --network none --entrypoint python
          camp-leverage-integration /app/tests/terminal/render_pty.py
